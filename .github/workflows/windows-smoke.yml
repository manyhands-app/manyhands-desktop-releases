# Install each published Windows release on a GitHub-hosted Windows runner, open it, and check its first
# screen. The box builds the Windows installer (cargo-xwin) but cannot run it, and every machine test
# drives the Linux build, so the NSIS installer and the WebView2 shell that testers download were run by
# nobody but testers. Its first runs, by hand, found a launch abort in 0.9.348 on 2 of 3 launches.
#
# What it does, for the release just published (or the tag you give, or the newest):
#   1. downloads that release's `Manyhands_<version>_x64-setup.exe` from this repository, and checks that
#      its sha256 is the digest GitHub keeps for the asset and that its name is the tag's version;
#   2. installs it silently (`/S`, per user, the way a tester's double-click does) and checks that the
#      uninstall entry carries the same version;
#   3. opens the app alone, then drives it with tauri-driver in front of a msedgedriver that matches the
#      runner's WebView2 (a mismatched one hangs at session start). Pass = the main window opens and
#      draws "Sign in to Manyhands", and the app left no crash report and no Windows crash event.
# No sign-in: the app talks to the live hub only as a signed-out copy does. The screenshots, the app
# log, the crash reports, the timings and the driver log are the run's artifact, kept 90 days
# (scripts/windows-smoke.mjs says what each file is). Every FAIL line is in app-log.txt or checks.txt.
#
# It lives here and not in the private app repository: this repository is public, so its Actions
# minutes are free, and the run needs nothing private. It checks out only this repository, reads no
# secret, calls no internal service, and has read access to contents and nothing else. The artifact is
# public: the signed-out sign-in screen, and the logs of a fresh install on a throwaway runner.
#
# Started by the release itself (`release: published`: the box's release.sh publishes the draft with a
# user token, which starts workflows). The box (brain scripts/desktop-smoke.sh, at the end of each
# auto-ship pass, brain ADR 449) finds the run by its title, starts it by hand when a release has none,
# reads the result, records it, and posts a note to Calum when a run fails. By hand too, for debugging:
# Actions tab > Run workflow, or `gh workflow run windows-smoke.yml -R manyhands-app/manyhands-desktop-releases -f tag=v0.9.350`.
name: windows-smoke
# The tag in the title: desktop-smoke.sh finds a run by this title. Keep the two in step.
run-name: windows-smoke ${{ inputs.tag || github.event.release.tag_name || 'newest' }}

# Read the repo and nothing else. Every action is pinned to a commit.
permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install, like v0.9.350. Empty = the newest release."
        required: false
        default: ""

# One run per tag at a time: a dispatch by the box that races the release's own run waits for it.
concurrency:
  group: windows-smoke-${{ inputs.tag || github.event.release.tag_name || 'newest' }}

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAURI_DRIVER_VERSION: 2.1.0
      RELEASES: manyhands-app/manyhands-desktop-releases
      OUT: ${{ github.workspace }}\smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/windows-smoke.mjs
          persist-credentials: false
          sparse-checkout-cone-mode: false

      - name: Download the installer and check it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          New-Item -ItemType Directory -Force $env:OUT, installer | Out-Null
          $fail = { param($m) "FAIL $m" | Tee-Object -Append "$env:OUT\checks.txt"; exit 1 }
          $tag = $env:TAG
          if (-not $tag) { $tag = gh release view -R $env:RELEASES --json tagName --jq .tagName }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { & $fail "tag: '$tag' is not a version tag" }
          $version = $Matches[1]
          $name = "Manyhands_${version}_x64-setup.exe"
          gh release download $tag -R $env:RELEASES -p $name -D installer
          if ($LASTEXITCODE -or -not (Test-Path "installer\$name")) { & $fail "download: $name is not an asset of $tag" }
          $setup = Get-Item "installer\$name"
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          # The asset's digest from the API as JSON, filtered here: a jq filter with quotes in it does not
          # survive pwsh's quoting into gh, and came back empty on the first run.
          $digest = ((gh api "repos/$env:RELEASES/releases/tags/$tag" | ConvertFrom-Json).assets | Where-Object name -eq $name).digest
          "release: $tag, version $version" | Tee-Object -Append "$env:OUT\install-log.txt"
          "installer: $name $([math]::Round($setup.Length / 1MB, 1)) MB sha256 $sha (GitHub: $digest)" | Tee-Object -Append "$env:OUT\install-log.txt"
          if ($digest -ne "sha256:$sha") { & $fail "checksum: $name is sha256 $sha, and GitHub's digest for it is '$digest'" }
          "SETUP=$($setup.FullName)" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV

      # Per user, as a tester's double-click installs it. The installer bootstraps WebView2 if the
      # machine has none. gh writes no Mark of the Web, so SmartScreen does not stop it here; it
      # does for a tester (README, "Download a build").
      - name: Install silently
        shell: pwsh
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $env:SETUP -ArgumentList '/S' -Wait -PassThru
          $t.Stop()
          "install: exit $($p.ExitCode) in $([math]::Round($t.Elapsed.TotalSeconds, 1)) s" | Tee-Object -Append "$env:OUT\install-log.txt"
          if ($p.ExitCode) { exit 1 }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Manyhands*' } | Select-Object -First 1
          "uninstall entry: $($entry.DisplayName) $($entry.DisplayVersion) at $($entry.InstallLocation)" | Tee-Object -Append "$env:OUT\install-log.txt"
          if ($entry.DisplayVersion -ne $env:VERSION) { "FAIL version: the uninstall entry says '$($entry.DisplayVersion)', the release is $env:VERSION" | Tee-Object -Append "$env:OUT\checks.txt"; exit 1 }
          $dir = if ($entry.InstallLocation) { $entry.InstallLocation.Trim('"') } else { "$env:LOCALAPPDATA\Manyhands" }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notlike 'uninstall*' | Select-Object -First 1
          if (-not $exe) { "no app exe in $dir" | Tee-Object -Append "$env:OUT\install-log.txt"; Get-ChildItem $dir -Recurse | Out-String | Add-Content "$env:OUT\install-log.txt"; exit 1 }
          "app: $($exe.FullName)" | Tee-Object -Append "$env:OUT\install-log.txt"
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # Restore and save apart, so a failed job still keeps the build for the next run.
      - name: Restore tauri-driver
        id: driver-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-windows

      - name: Build tauri-driver
        if: steps.driver-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install tauri-driver --version $env:TAURI_DRIVER_VERSION --locked

      - name: Save tauri-driver
        if: steps.driver-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ env.TAURI_DRIVER_VERSION }}-windows

      # msedgedriver must be the WebView2 runtime's version, not Edge's: the runner's own
      # EdgeDriver (EDGEWEBDRIVER) follows Edge, which can be a build apart. It is the fallback.
      - name: Fetch the msedgedriver that matches WebView2
        shell: pwsh
        run: |
          $key = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $wv = @("HKLM:\SOFTWARE\WOW6432Node\$key", "HKLM:\SOFTWARE\$key", "HKCU:\Software\$key") |
            ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          "webview2: $wv" | Tee-Object -Append "$env:OUT\install-log.txt"
          "edge: $((Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' -ErrorAction SilentlyContinue).VersionInfo.ProductVersion)" | Tee-Object -Append "$env:OUT\install-log.txt"
          $driver = $null
          if ($wv) {
            try {
              Invoke-WebRequest "https://msedgedriver.microsoft.com/$wv/edgedriver_win64.zip" -OutFile edgedriver.zip
              Expand-Archive edgedriver.zip -DestinationPath edgedriver -Force
              $driver = (Resolve-Path edgedriver\msedgedriver.exe).Path
            } catch { "msedgedriver $wv download failed: $_" | Tee-Object -Append "$env:OUT\install-log.txt" }
          }
          if (-not $driver) { $driver = Join-Path $env:EDGEWEBDRIVER msedgedriver.exe }
          "msedgedriver: $driver $((& $driver --version) -join ' ')" | Tee-Object -Append "$env:OUT\install-log.txt"
          "NATIVE_DRIVER=$driver" >> $env:GITHUB_ENV

      # Every start and exit of the app, its WebView2 and the driver, with the parent and the exit
      # code, for the rest of the job: a process that quits at once leaves no other trace.
      - name: Trace the app's processes
        shell: pwsh
        run: |
          $script = @'
          param($log)
          Register-CimIndicationEvent -ClassName Win32_ProcessStartTrace -SourceIdentifier start
          Register-CimIndicationEvent -ClassName Win32_ProcessStopTrace -SourceIdentifier stop
          while ($true) {
            $e = Wait-Event -Timeout 1
            if (-not $e) { continue }
            $n = $e.SourceEventArgs.NewEvent
            if ($n.ProcessName -match 'pavilion|manyhands|msedgewebview2|msedgedriver|tauri-driver|WerFault') {
              $cmd = if ($e.SourceIdentifier -eq 'start') { (Get-CimInstance Win32_Process -Filter "ProcessId=$($n.ProcessID)" -ErrorAction SilentlyContinue).CommandLine } else { '' }
              '{0:HH:mm:ss.fff} {1} {2} pid={3} parent={4} exit={5} {6}' -f (Get-Date), $e.SourceIdentifier, $n.ProcessName, $n.ProcessID, $n.ParentProcessID, $n.ExitStatus, $cmd | Add-Content $log
            }
            Remove-Event -EventIdentifier $e.EventIdentifier
          }
          '@
          Set-Content proc-trace.ps1 $script
          Start-Process powershell -ArgumentList '-NoProfile', '-File', (Resolve-Path proc-trace.ps1), "$env:OUT\process-trace.txt" -WindowStyle Hidden
          Start-Sleep 3

      # The app on its own, no driver: does a window open, and does the process stay up. Its
      # stderr is kept (a release build has no console, but a redirected handle still gets it).
      - name: Launch the app without a driver
        shell: pwsh
        env:
          RUST_LOG: info
          RUST_BACKTRACE: "1"
        run: |
          $t = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $env:APP_EXE -PassThru -RedirectStandardError "$env:OUT\launch-stderr.txt" -RedirectStandardOutput "$env:OUT\launch-stdout.txt"
          $title = ''
          while ($t.Elapsed.TotalSeconds -lt 60 -and -not $p.HasExited) {
            $p.Refresh(); if ($p.MainWindowTitle) { $title = $p.MainWindowTitle; break }
            Start-Sleep -Milliseconds 250
          }
          $open = [math]::Round($t.Elapsed.TotalSeconds, 1)
          Start-Sleep 10
          $p.Refresh()
          $exited = $p.HasExited; $code = if ($exited) { $p.ExitCode } else { '' }
          "launch: window '$title' after $open s; still running after 10 s more: $(-not $p.HasExited)$(if ($p.HasExited) { ", exit $($p.ExitCode)" })" | Tee-Object -Append "$env:OUT\install-log.txt"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:OUT\launch.png")
          Get-ChildItem "$env:APPDATA\markets.pavilion.desktop", "$env:LOCALAPPDATA\markets.pavilion.desktop" -ErrorAction SilentlyContinue | Out-String | Add-Content "$env:OUT\launch-files.txt"
          # Gone before the driver starts one: a second copy would be handed to this one by single-instance.
          Get-Process | Where-Object { $_.Path -eq $env:APP_EXE } | Stop-Process -Force
          Start-Sleep 3
          # $exited and $code from before the Stop-Process above, which ends the app on purpose.
          if (-not $title) { "FAIL launch: no window within 60 s$(if ($exited) { ", the app exited $code" })" | Tee-Object -Append "$env:OUT\checks.txt"; exit 1 }
          if ($exited) { "FAIL launch: the app exited $code within 10 s of its window opening" | Tee-Object -Append "$env:OUT\checks.txt"; exit 1 }

      - name: Open the app and check its first screen
        if: always() && env.NATIVE_DRIVER != ''
        shell: pwsh
        env:
          RUST_LOG: info
          RUST_BACKTRACE: "1"
        run: node scripts/windows-smoke.mjs --app "$env:APP_EXE" --driver "$HOME\.cargo\bin\tauri-driver.exe" --native "$env:NATIVE_DRIVER" --out "$env:OUT"

      # The app keeps no log file of its own (a release build has no console); its data folder holds
      # a crash report when it panicked, and Windows logs a crash or a hang in the Application log.
      - name: Collect the app's files and Windows' log
        if: always()
        shell: pwsh
        run: |
          $f = "$env:OUT\app-files.txt"
          foreach ($d in "$env:APPDATA\markets.pavilion.desktop", "$env:LOCALAPPDATA\markets.pavilion.desktop") {
            "== $d" | Add-Content $f
            Get-ChildItem $d -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 300 | Add-Content $f
            # The json files hold the app's own crash reports (`crashes\`, src-tauri/src/crash.rs).
            Get-ChildItem $d -Filter *.json -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "-- $($_.FullName)"; Get-Content $_.FullName -Raw } | Add-Content $f
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30); Level = 1, 2, 3 } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Id, Message | Out-String -Width 300 | Set-Content "$env:OUT\windows-events.txt"

      # No crash at start: the app writes a crash report to `crashes\` when it panics (src-tauri/src/crash.rs
      # in the app source), and Windows logs an Application Error or starts WerFault for a native crash.
      - name: Check for crashes
        if: always() && env.APP_EXE != ''
        shell: pwsh
        run: |
          $bad = 0
          $crashes = foreach ($d in "$env:APPDATA\markets.pavilion.desktop", "$env:LOCALAPPDATA\markets.pavilion.desktop") { Get-ChildItem "$d\crashes" -Filter *.json -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force "$env:OUT\crashes" | Out-Null
          foreach ($c in $crashes) { Copy-Item $c.FullName "$env:OUT\crashes\"; "FAIL crash: the app wrote $($c.Name): $((Get-Content $c.FullName -Raw).Substring(0, [math]::Min(300, (Get-Content $c.FullName -Raw).Length)) -replace '\s+', ' ')" | Tee-Object -Append "$env:OUT\checks.txt"; $bad = 1 }
          $exe = Split-Path $env:APP_EXE -Leaf
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30); ProviderName = 'Application Error', 'Windows Error Reporting' } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match [regex]::Escape($exe) }
          foreach ($e in $events) { "FAIL crash: Windows logged $($e.ProviderName) $($e.Id): $(($e.Message -split "`n")[0..2] -join ' ')" | Tee-Object -Append "$env:OUT\checks.txt"; $bad = 1 }
          if (-not $bad) { "crashes: none (no crash report, no Windows crash event for $exe)" | Tee-Object -Append "$env:OUT\install-log.txt" }
          exit $bad

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## Windows smoke" >> $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:OUT\install-log.txt" -ErrorAction SilentlyContinue | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:OUT\checks.txt" -ErrorAction SilentlyContinue | ForEach-Object { "- **$_**" } >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$env:OUT\timings.json") { '```json' >> $env:GITHUB_STEP_SUMMARY; Get-Content "$env:OUT\timings.json" >> $env:GITHUB_STEP_SUMMARY; '```' >> $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-smoke
          path: smoke/
          retention-days: 90
